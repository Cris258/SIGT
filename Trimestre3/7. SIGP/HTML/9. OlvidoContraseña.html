<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header">
        <div class="letter">Vibra Positiva Pijamas</div>
    </div>
  </header>
  <input type="checkbox" id="modal-exito" class="modal-exito-toggle">
  <div class="modal modal-exito">
    <div class="modal-contenido">
      <h2>CAMBIO DE CONTRASEÑA</h2>
      <p><strong>Ha sido enviada una Nueva Contraseña a su Correo</strong></p>
      <div class="modal-buttons">
        <a href="1. Principal.html" class="login-btn">Volver</a>
      </div>
    </div>
  </div>
  <h1>Olvido su Contraseña</h1>
  <form class="password-form">
    <div class="form-group">
        <label for="correo">Correo Electrónico de Recuperacion</label>
        <input type="email" id="correo" name="correo">
    </div>
    <div class="button-container">
        <a href="1. Principal.html" class="login-btn">Volver</a>
        <label for="modal-exito" class="login-btn">Confirmar</label>
    </div>
    </form>
      <footer class="footer">
        <div class="footer-contenedor">
            <div class="footer-seccion">
                <h3>Contacto</h3>
                <p>📍 <strong>Dirección:</strong> Calle 2 Sur #10 - 39, Bogota, Colombia</p>
                <p>📞 <strong>Teléfono:</strong> +57 305 7291000</p>
            </div>
            <div class="footer-seccion">
                <h3>Síguenos</h3>
                <a href="https://www.facebook.com/share/1P59bAoYSa/"><img src="img/face.png" alt="Facebook"></a>
                <a href="https://www.instagram.com/vibrapositivapijamas?igsh=MXB6eGQzazE3eWFseQ=="><img src="img/ins.png" alt="Instagram"></a>
            </div>
        </div>
        <div class="footer-derechos">
            <p>© Vibra Positiva Pijamas - Todos los derechos reservados</p>
        </div>
    </footer>
</body>
</html>
