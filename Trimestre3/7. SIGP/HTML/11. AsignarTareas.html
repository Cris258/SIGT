<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignar Tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body {
          background-color: #c7e4fe;
          margin: 0;
          padding: 0;
        }
      </style>
  <header>
    <div class="header">
        <div class="letter">Vibra Positiva Pijamas</div>
    </div>
  </header>
  <h1>Asignar Tarea a Empleados</h1>
  <input type="checkbox" id="modal-toggle" class="modal-toggle">
  <div class="modal">
    <div class="modal-contenido">
      <h2>Tarea Enviada Satisfactoriamente</h2>
      <div class="buttons-row">
        <a href="4. Administrador.html" class="login-btn">Volver al Inicio</a>
        <label for="modal-toggle" class="login-btn">Enviar Otra Tarea</label>
      </div>
    </div>
</div>
    <form>
        <div class="form-group">
            <label for="idEmpleado">Id Empleado</label>
            <input type="text" id="idEmpleado" name="idEmpleado">
        </div>
        <div class="form-group">
            <label for="tarea">Tipo de Tarea</label>
            <input type="text" id="tarea" name="tarea">
        </div>
        <div class="form-group">
            <label for="fecha">Fecha Minima de Entrega</label>
            <input type="date" id="fecha" name="fecha">
        </div>
        <div class="form-group">
            <label for="fecha">Fecha Limite de Entrega</label>
            <input type="date" id="fecha" name="fecha">
        </div>
        <div class="form-group">
            <label for="maquina">Tipo de Maquina a Usar</label>
            <input type="text" id="maquina" name="maquina">
        </div>
        <div class="form-group">
            <label for="tela">Tipo de Tela a Usar</label>
            <input type="text" id="tela" name="tela">
        </div>
        <div class="buttons-row">
            <a href="4. Administrador.html" class="login-btn">Cancelar</a>
            <label for="modal-toggle" class="login-btn">Enviar</label>
        </div>
    </form>
  <footer class="footer">
    <div class="footer-contenedor">
        <div class="footer-seccion">
            <h3>Contacto</h3>
            <p>📍 <strong>Dirección:</strong> Calle 2 Sur #10 - 39, Bogota, Colombia</p>
            <p>📞 <strong>Teléfono:</strong> +57 305 7291000</p>
        </div>
        <div class="footer-seccion">
            <h3>Síguenos</h3>
            <a href="https://www.facebook.com/share/1P59bAoYSa/"><img src="img/face.png" alt="Facebook"></a>
            <a href="https://www.instagram.com/vibrapositivapijamas?igsh=MXB6eGQzazE3eWFseQ=="><img src="img/ins.png" alt="Instagram"></a>
        </div>
    </div>
    <div class="footer-derechos">
        <p>© Vibra Positiva Pijamas - Todos los derechos reservados</p>
    </div>
   </footer>
</body>
</html>
